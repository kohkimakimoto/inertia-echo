name: test

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev-v5
  pull_request:
    branches:
      - master

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - examples/getting-started
          - examples/helloworld
          - examples/login-form
          - examples/ssr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Verify module dependencies
        working-directory: ${{ matrix.module }}
        run: |
          go mod verify
          go mod tidy -diff

      - name: Check for Echo v4 dependencies
        working-directory: ${{ matrix.module }}
        run: |
          if go list -m all | grep -q '^github.com/labstack/echo/v4 '; then
            echo "::error::Echo v4 remains in the module graph"
            go list -m all | grep '^github.com/labstack/echo/v4 '
            exit 1
          fi

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test -race -timeout 30m ./...
